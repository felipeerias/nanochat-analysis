[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nanochat-analysis"
version = "0.1.0"
description = "Reproducible analysis and operations for nanochat telemetry"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "filelock>=3.19",
    "matplotlib>=3.10",
    "numpy>=2.3",
    "pandas>=2.3",
    "pyarrow>=21",
    "torch==2.9.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.setuptools]
packages = ["loader"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
